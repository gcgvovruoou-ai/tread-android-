
name: Сборка tread APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v4

      - name: Проверить архив
        run: |
          ls -lah
          file tread_github_android.zip
          unzip -t tread_github_android.zip

      - name: Распаковать архив
        run: unzip -q tread_github_android.zip

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: gradle -p tread_github_android assembleDebug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: tread-apk
          path: tread_github_android/app/build/outputs/apk/debug/app-debug.apk
